<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self'">
    <title>Focus Bear</title>
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/buttons.css">
    <link rel="stylesheet" href="styles/tray.css">
</head>
<body>
    <!--
      Tray popup, laid out like the Windows tray menu (TrayMenu.xaml): a card for
      the focus session, then rows that open parts of the app. Colours come from
      tokens.css; the script sets <html data-theme> to match the main window.
    -->
    <header class="tray-header">
        <img src="../../public/bear-icon.png" alt="" class="tray-logo">
        <span class="tray-brand">focus bear</span>
    </header>

    <section class="tray-card" id="focus-card" aria-live="polite">
        <div class="tray-card__row">
            <span class="tray-icon" aria-hidden="true">⏱</span>
            <div class="tray-card__text">
                <div class="tray-card__title" id="focus-title">Focus session</div>
                <div class="tray-card__subtitle" id="focus-subtitle">Not running</div>
            </div>
        </div>
        <button type="button" id="focus-primary" class="fb-btn fb-btn--primary fb-btn--block">Start Focus Session</button>
        <button type="button" id="focus-pause" class="fb-btn fb-btn--gray fb-btn--block" hidden>Pause Focus Session</button>
    </section>

    <nav class="tray-rows" aria-label="Open">
        <button type="button" class="tray-row" data-open="day-plan">
            <span class="tray-icon" aria-hidden="true">🗓</span><span>Day Plan</span>
        </button>
        <button type="button" class="tray-row" data-open="micro-break">
            <span class="tray-icon" aria-hidden="true">☕</span>
            <span class="tray-row__text"><span>Start Micro Break</span><span class="tray-row__sub" id="break-next" hidden></span></span>
        </button>
        <button type="button" class="tray-row" data-open="todo-list">
            <span class="tray-icon" aria-hidden="true">✅</span><span>To-do list</span>
        </button>
        <button type="button" class="tray-row" data-open="blocking">
            <span class="tray-icon" aria-hidden="true">🛡</span><span>Blocking</span>
        </button>
        <button type="button" class="tray-row" id="open-app">
            <span class="tray-icon" aria-hidden="true">🐻</span><span>Open Focus Bear</span>
        </button>
    </nav>

    <footer class="tray-footer">
        <button type="button" id="quit" class="fb-btn fb-btn--gray fb-btn--small">Quit Focus Bear</button>
    </footer>

    <script type="module" src="../electron/tray.js"></script>
</body>
</html>
